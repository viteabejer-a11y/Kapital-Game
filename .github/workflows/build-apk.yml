name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Kapital_10_0_Visual_Market_Update.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract game
        run: |
          unzip -q Kapital_10_0_Visual_Market_Update.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p project assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Kapital-10-APK
          path: project/app/build/outputs/apk/debug/*.apk
